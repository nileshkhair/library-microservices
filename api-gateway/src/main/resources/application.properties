spring.application.name=api-gateway
server.port=8080

#User Service Route
spring.cloud.gateway.routes[0].id=user-service
#spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

#Book Service Route
spring.cloud.gateway.routes[1].id=book-service
#spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/books/**

#Rental Service Route
spring.cloud.gateway.routes[2].id=rental-service
#spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].uri=lb://RENTAL-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rentals/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
#eureka.instance.ip-address=localhost
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}